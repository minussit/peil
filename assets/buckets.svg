<svg xmlns="http://www.w3.org/2000/svg" width="551" height="350" viewBox="0 0 551 350" role="img" aria-label="peil buckets terminal output">
  <rect width="551" height="350" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10 A10 10 0 0 1 10 0 H541 A10 10 0 0 1 551 10 V34 H0 Z" fill="#161b22"/>
  <line x1="0" y1="34" x2="551" y2="34" stroke="#30363d"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="39" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="17" r="5.5" fill="#27c93f"/>
  <text x="275.5" y="21" text-anchor="middle" font-size="11.5"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6e7681">peil buckets</text>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#c9d1d9">
    <text y="65" xml:space="preserve"><tspan x="18.0" fill="#3fb950" font-weight="600">$</tspan><tspan x="33.6" fill="#e6edf3" font-weight="600">peil buckets</tspan></text>
    <text y="105" xml:space="preserve"><tspan x="18.0" fill="#58a6ff" font-weight="600">Where the money goes</tspan></text>
    <text y="125" xml:space="preserve"><tspan x="18.0" fill="#6e7681">token share against cost share</tspan></text>
    <text y="165" xml:space="preserve"><tspan x="18.0" fill="#6e7681">BUCKET            RATE  TOKENS   TOK %    COST  COST %</tspan></text>
    <text y="185" xml:space="preserve"><tspan x="18.0" fill="#c9d1d9">Cache read        </tspan><tspan x="158.4" fill="#8b949e">0.1x</tspan><tspan x="189.6" fill="#c9d1d9">   73.0M  </tspan><tspan x="267.6" fill="#58a6ff" font-weight="600">98.63%</tspan><tspan x="330.0" fill="#7ee787">$36.50</tspan><tspan x="400.2" fill="#d29922" font-weight="600">76.5%</tspan></text>
    <text y="205" xml:space="preserve"><tspan x="18.0" fill="#c9d1d9">Cache write 1h    </tspan><tspan x="158.4" fill="#8b949e">2.0x</tspan><tspan x="189.6" fill="#c9d1d9">  942.3K   </tspan><tspan x="275.4" fill="#58a6ff" font-weight="600">1.27%</tspan><tspan x="337.8" fill="#7ee787">$9.42</tspan><tspan x="400.2" fill="#d29922" font-weight="600">19.7%</tspan></text>
    <text y="225" xml:space="preserve"><tspan x="18.0" fill="#c9d1d9">Output          </tspan><tspan x="142.8" fill="#8b949e">output</tspan><tspan x="189.6" fill="#c9d1d9">   72.1K   </tspan><tspan x="275.4" fill="#58a6ff">0.10%</tspan><tspan x="337.8" fill="#7ee787">$1.80</tspan><tspan x="408.0" fill="#8b949e">3.8%</tspan></text>
    <text y="245" xml:space="preserve"><tspan x="18.0" fill="#c9d1d9">Input             </tspan><tspan x="158.4" fill="#8b949e">1.0x</tspan><tspan x="189.6" fill="#c9d1d9">     163   </tspan><tspan x="275.4" fill="#58a6ff">0.00%</tspan><tspan x="330.0" fill="#7ee787">$&lt;0.01</tspan><tspan x="408.0" fill="#8b949e">0.0%</tspan></text>
    <text y="265" xml:space="preserve"><tspan x="18.0" fill="#c9d1d9">Cache write 5m   </tspan><tspan x="150.6" fill="#8b949e">1.25x</tspan><tspan x="189.6" fill="#c9d1d9">       0   </tspan><tspan x="275.4" fill="#58a6ff">0.00%</tspan><tspan x="337.8" fill="#7ee787">$0.00</tspan><tspan x="408.0" fill="#8b949e">0.0%</tspan></text>
    <text y="305" xml:space="preserve"><tspan x="18.0" fill="#8b949e">  Cache reads are </tspan><tspan x="158.4" fill="#58a6ff" font-weight="600">98.6%</tspan><tspan x="197.4" fill="#8b949e"> of tokens but </tspan><tspan x="314.4" fill="#d29922" font-weight="600">76.5%</tspan><tspan x="353.4" fill="#8b949e"> of cost — they bill</tspan></text>
    <text y="325" xml:space="preserve"><tspan x="18.0" fill="#8b949e">  at a tenth of the input rate.</tspan></text>
  </g>
</svg>
